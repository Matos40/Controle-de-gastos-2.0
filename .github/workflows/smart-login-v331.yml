name: Smart Login V33.1 candidate
on:
  push:
    branches: [feature/v33-1-smart-login]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/smart-login-auth.test.mjs
      - run: find js/smartAccount -name '*.js' -exec node --check {} \;
