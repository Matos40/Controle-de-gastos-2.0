name: V34.6.5 production candidate only
on:
  push:
    branches: [release-candidate/v34.6.5-production]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'Matos40/Controle-de-gastos-2.0' && github.ref == 'refs/heads/release-candidate/v34.6.5-production'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve financial and auth logic
        run: |
          git diff --exit-code 99961a8e3ff6018419ed3bdbffcb417e8edb4c03 -- js/state.js js/services js/experimentalSync js/productionV2 ':!js/productionV2/smartLoginOfficialAuth.mjs' ':!js/productionV2/firebaseAdapter.mjs' manifest.json raytech-icon-192.png raytech-icon-512.png raytech-app-192.png raytech-app-512.png
          node --check js/productionV2/smartLoginOfficialAuth.mjs
          node --check js/productionV2/firebaseAdapter.mjs
      - name: Install pinned local dependencies
        working-directory: validation/v3465
        run: npm ci --no-audit --no-fund
      - name: Build production offline inventory
        working-directory: validation/v3465
        run: node build.mjs
      - name: Financial and identity regressions
        run: |
          node --test tests/*.test.cjs validation/smart-login-official/*.test.mjs
      - name: Install Chromium
        working-directory: validation/v3465
        run: npx playwright install --with-deps chromium
      - name: Real offline Chromium (isolated account fixture, actual libraries)
        working-directory: validation/v3465
        run: node --test offline.test.mjs
      - name: Verify candidate hashes and package
        run: |
          node --check candidate/sw.js
          (cd candidate && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../candidate-sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: raytech-v3465-production-candidate
          path: |
            candidate/
            candidate-sha256.txt
          if-no-files-found: error
