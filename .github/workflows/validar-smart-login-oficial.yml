name: V33.4 identity isolation
on:
  push:
    branches: [feature/v33-4-smart-login-oficial]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test validation/smart-login-official/*.test.mjs

      - run: find js -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: node --check sw.js

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: validation/production-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: cp ../../docs/firestore-v334-producao-candidata.rules firestore.rules
      - run: npx firebase emulators:exec --project demo-raytech-production-v2 --only firestore "node --test rules-v334.test.mjs"
