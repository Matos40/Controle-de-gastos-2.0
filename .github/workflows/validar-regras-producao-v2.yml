name: V2 production rules (emulator only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/production-v2/**'
      - 'docs/firestore-producao-v2-proposta.rules'
      - 'js/productionV2/**'
      - 'js/experimentalSync/**'
      - '.github/workflows/validar-regras-producao-v2.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: validation/production-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies
        run: npm install --no-audit --no-fund
      - name: Copy exact versioned candidate rules
        run: cp ../../docs/firestore-producao-v2-proposta.rules firestore.rules
      - name: Run Firestore rules tests with demo project only
        run: npm test
