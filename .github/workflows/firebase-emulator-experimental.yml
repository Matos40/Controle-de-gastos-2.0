name: Firebase experimental (emulators only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'experimental/firebase/**'
      - 'experimental/phase2/**'
      - 'experimental/diff03/**'
      - 'js/services/financialRepositoryV11*.js'
      - '.github/workflows/firebase-emulator-experimental.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experimental/firebase
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated SDKs
        run: npm install --no-audit --no-fund
      - name: Install isolated Functions dependencies
        run: npm run install-functions
      - name: Test durable queue and staging configuration
        run: npm run test:queue
      - name: Run Auth, Functions and Firestore emulator tests
        run: npm run test:emulator
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run real browser IndexedDB integration
        run: npm run test:browser
      - name: Build isolated physical staging bundle
        run: npm run build:staging
      - name: Retain staging bundle without deployment
        uses: actions/upload-artifact@v4
        with:
          name: raytech-staging-isolated
          path: experimental/firebase/dist-staging/
          if-no-files-found: error
          retention-days: 7
      - name: Package HML isolated ZIP and SHA-256
        run: npm run package:hml
      - name: Run exactly 32 HML scenarios
        shell: bash
        run: |
          set -o pipefail
          npm run test:hml | tee hml-output/hml-tests.tap
          npm run report:hml
          cd hml-output
          sha256sum -c raytech-cg-hml-001-v1.1.zip.sha256
      - name: Retain HML ZIP, checksum and test evidence without publication
        uses: actions/upload-artifact@v4
        with:
          name: raytech-cg-hml-001-v1.1
          path: |
            experimental/firebase/hml-output/raytech-cg-hml-001-v1.1.zip
            experimental/firebase/hml-output/raytech-cg-hml-001-v1.1.zip.sha256
            experimental/firebase/hml-output/validation-report.json
            experimental/firebase/hml-output/hml-tests.tap
          if-no-files-found: error
          retention-days: 7
